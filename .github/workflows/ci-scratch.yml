# Temporary: downloads candidate stock photos to compare. Delete before merging.
name: ci-scratch
on:
  push:
    branches: [redesign]
    paths: [".github/workflows/ci-scratch.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow==10.4.0
      - name: Download candidates
        shell: python
        run: |
          import io, json, os, urllib.request
          from PIL import Image
          os.makedirs("/tmp/out", exist_ok=True)
          ids = ["Gc21mlayucU","3EsmLq8qdy0","xNdLMWwp49U","C2keINMOhIE","-3g-Z0fjn1Q","biujgb9Ml3o","fXPc86SgjvE",
                 "1tyWjPwKr3c","U-fJl3lTWJ4","6sJMJUwU1LI","iVeICmo_N1o","Gf3bWrqiIGQ","c3S6411v_Pc","L6wSaDnlXeY",
                 "ReUoz0CwfGo","YQNKKNLlybs","2TnAs_WgcgI","xofvJ26aBFo"]
          info = {}
          for i in ids:
              try:
                  req = urllib.request.Request(f"https://unsplash.com/photos/{i}/download?force=true", headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=90) as r:
                      data = r.read(); final = r.geturl()
                  im = Image.open(io.BytesIO(data)); info[i] = {"w": im.width, "h": im.height, "bytes": len(data), "url": final.split("?")[0]}
                  im.convert("RGB").thumbnail((900, 900)); 
                  t = im.convert("RGB"); t.thumbnail((900, 900)); t.save(f"/tmp/out/{i}.jpg", quality=80)
              except Exception as e:
                  info[i] = str(e)
          open("/tmp/out/info.json", "w").write(json.dumps(info, indent=2))
      - name: Save to ci-scratch branch
        run: |
          cd /tmp/out
          git init -q -b ci-scratch
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "scratch ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-scratch
