# Temporary: checks the address-suggestion API. Delete before merging.
name: ci-scratch
on:
  push:
    branches: [redesign]
    paths: [".github/workflows/ci-scratch.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Query Photon
        run: |
          mkdir -p /tmp/out && cd /tmp/out
          for q in "14 Chamberlain Ave" "6 Weslock" "100 Bank St Ottawa" "1500 Fisher"; do
            f=$(echo "$q" | tr ' ' '_')
            curl -sS -D "$f.headers" -H "Origin: https://www.dahrouj.com" -A "dahrouj.com" \
              "https://photon.komoot.io/api/?q=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")&limit=6&lang=en&lat=45.35&lon=-75.75&bbox=-76.36,44.96,-75.24,45.54&layer=house" -o "$f.json" || true
            sleep 1
          done
          ls -la
      - name: Save to ci-scratch branch
        run: |
          cd /tmp/out
          git init -q -b ci-scratch
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "scratch ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-scratch
