# Temporary: downloads candidate stock photos to compare. Delete before merging.
name: ci-scratch
on:
  push:
    branches: [redesign]
    paths: [".github/workflows/ci-scratch.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow==10.4.0
      - name: Download candidates
        shell: python
        run: |
          import io, json, os, urllib.request
          from PIL import Image
          os.makedirs("/tmp/out", exist_ok=True)
          bases = {
            "canal-chateau-laurier": "https://images.unsplash.com/photo-1786327448955-f903f07611c7",
            "frozen-locks": "https://images.unsplash.com/photo-1785190422992-eb1382167464",
            "canal-from-laurier": "https://images.unsplash.com/photo-1645590666364-40f132d7e600",
            "flag-parliament": "https://images.unsplash.com/photo-1578973615934-8d9cdb0792b4",
            "skyline-across-river": "https://images.unsplash.com/photo-1782751935265-3a6ef9f6c266",
          }
          info = {}
          for k, u in bases.items():
              try:
                  data = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=120).read()
                  im = Image.open(io.BytesIO(data)); info[k] = {"w": im.width, "h": im.height, "mb": round(len(data)/1e6, 1)}
                  t = im.convert("RGB"); t.thumbnail((900, 900)); t.save(f"/tmp/out/{k}.jpg", quality=80)
              except Exception as e:
                  info[k] = str(e)
          open("/tmp/out/info.json", "w").write(json.dumps(info, indent=2))
      - name: Save to ci-scratch branch
        run: |
          cd /tmp/out
          git init -q -b ci-scratch
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "scratch ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-scratch
