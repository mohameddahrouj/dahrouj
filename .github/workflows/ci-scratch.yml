# Temporary: fetches files the build environment can't reach and saves them
# to the ci-scratch branch. Delete before merging.
name: ci-scratch
on:
  push:
    branches: [redesign]
    paths: [".github/workflows/ci-scratch.yml", "scripts/**"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pdfplumber==0.11.4
      - name: Dump OREB text and try the parser
        run: |
          mkdir -p /tmp/out
          python scripts/update_stats.py --month 2026-09 --dump /tmp/out/oreb-2026-09.txt > /tmp/out/parse-2026-09.log 2>&1 || true
          python scripts/update_stats.py --month 2026-08 --dump /tmp/out/oreb-2026-08.txt > /tmp/out/parse-2026-08.log 2>&1 || true
          cp data/stats.json /tmp/out/stats-after.json
      - name: Fetch brokerage logos
        run: |
          cd /tmp/out
          for f in RAHR-FooterLogo_White.svg og-image.png; do
            curl -sSL -A "Mozilla/5.0" -o "$f" "https://www.rightathomerealty.com/$f" || true
          done
          curl -sSL -A "Mozilla/5.0" -o rahr-home.html https://www.rightathomerealty.com/ || true
          grep -oE '(src|href)="[^"]*\.(svg|png|webp)"' rahr-home.html | sort -u > rahr-images.txt || true
          while read -r line; do
            p=$(echo "$line" | sed -E 's/^(src|href)="//; s/"$//')
            case "$p" in http*) u="$p";; /*) u="https://www.rightathomerealty.com$p";; *) u="https://www.rightathomerealty.com/$p";; esac
            n=$(basename "$p")
            echo "$n" | grep -qi -E 'logo|rahr' && curl -sSL -A "Mozilla/5.0" -o "logo-$n" "$u" || true
          done < rahr-images.txt
          ls -la
      - name: Save to ci-scratch branch
        run: |
          cd /tmp/out
          git init -q -b ci-scratch
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "scratch ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-scratch
