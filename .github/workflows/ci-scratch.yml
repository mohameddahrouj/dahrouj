# Temporary: fetches files the build environment can't reach. Delete before merging.
name: ci-scratch
on:
  push:
    branches: [redesign]
    paths: [".github/workflows/ci-scratch.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow==10.4.0
      - name: Geocode office, build map, check links
        shell: python
        run: |
          import json, math, urllib.request, urllib.parse, io, os
          from PIL import Image
          os.makedirs("/tmp/out", exist_ok=True)
          UA = {"User-Agent": "dahrouj.com site build (mohamed@dahrouj.com)"}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30) as r:
                  return r.status, r.read()
          log = {}
          for q in ["14 Chamberlain Avenue, Ottawa, Ontario", "Chamberlain Avenue & Bank Street, Ottawa"]:
              try:
                  s, b = get("https://nominatim.openstreetmap.org/search?" + urllib.parse.urlencode({"q": q, "format": "json", "limit": 3, "addressdetails": 1}))
                  log[q] = json.loads(b)
              except Exception as e:
                  log[q] = str(e)
          open("/tmp/out/geocode.json", "w").write(json.dumps(log, indent=2))
          hits = [r for v in log.values() if isinstance(v, list) for r in v]
          lat, lon = (float(hits[0]["lat"]), float(hits[0]["lon"])) if hits else (45.4047, -75.6900)
          for z in (15, 16):
              n = 2 ** z
              xf = (lon + 180) / 360 * n
              yf = (1 - math.asinh(math.tan(math.radians(lat))) / math.pi) / 2 * n
              x0, y0 = int(xf) - 1, int(yf) - 1
              img = Image.new("RGB", (256 * 3, 256 * 3))
              for dx in range(3):
                  for dy in range(3):
                      try:
                          s, b = get(f"https://tile.openstreetmap.org/{z}/{x0+dx}/{y0+dy}.png")
                          img.paste(Image.open(io.BytesIO(b)).convert("RGB"), (dx * 256, dy * 256))
                      except Exception as e:
                          print("tile", e)
              px, py = (xf - x0) * 256, (yf - y0) * 256
              img.save(f"/tmp/out/map-z{z}.png")
              open(f"/tmp/out/map-z{z}.json", "w").write(json.dumps({"lat": lat, "lon": lon, "px": px, "py": py}))
          links = {}
          for u in ["https://www.rightathomerealty.com/landtransfertaxcalculator",
                    "https://www.rightathomerealty.com/mortgage/calculator",
                    "https://www.rightathomerealty.com/MortgageQualifier.html",
                    "https://www.rightathomerealty.com/PremiumCalculator.html"]:
              try:
                  s, b = get(u); links[u] = [s, len(b), b[:300].decode("utf8", "ignore")]
              except Exception as e:
                  links[u] = str(e)
          open("/tmp/out/links.json", "w").write(json.dumps(links, indent=2))
      - name: Save to ci-scratch branch
        run: |
          cd /tmp/out
          git init -q -b ci-scratch
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "scratch ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-scratch
